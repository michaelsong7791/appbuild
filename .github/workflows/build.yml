name: Build APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone + watch APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Forge-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk out/Forge-watch.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: forge-apks
          path: out/*.apk

      - name: Publish to "latest" release (direct download link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Forge-phone.apk out/Forge-watch.apk \
            --title "Forge build ${GITHUB_SHA::7}" \
            --notes "Install Forge-phone.apk on the Galaxy Z Fold7. Forge-watch.apk goes on the Galaxy Watch (see README)." \
            --latest
