const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// 2D (stick units) -> 3D metres. x forward, y up. Ground at y=190.

    const off = latOff.clone().multiplyScalar(HW * sgn);

  const lN = leg('kN', 'fN', front ? side('fN', 'hp') : 1), lF = leg('kF', 'fF', front ? side('fF', 'hp') : -1);

  const hup = hd.clone().sub(nk).normalize(); let hant = ant.clone().sub(hup.clone().multiplyScalar(ant.dot(hup))).normalize();

  ellipsoid(hd.clone().addScaledVector(hup, -0.045).addScaledVector(hant, 0.03), 0.06, 0.06, 0.07, hb); // jaw
  // ---- limbs ----

    const fd = Hn.clone().sub(E).normalize();
    const hb2 = new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(fd, lat.clone().add(V(0.0001, 0, 0))).normalize(), fd, lat.clone()).setPosition(0, 0, 0);
    const handM = mesh(new THREE.SphereGeometry(1, 24, 16), MAT); handM.scale.set(0.028, 0.06, 0.042);
    handM.position.copy(Hn).addScaledVector(fd, 0.045); handM.quaternion.setFromUnitVectors(UP, fd);
  }
  for (const [Hh, K, Fo] of [lN, lF]) {
    ball(Hh, 0.075); limb(Hh, K, 0.075, 0.052); ball(K, 0.054); limb(K, Fo, 0.05, 0.036); ball(Fo, 0.038);
    const sd = Fo.clone().sub(K).normalize();

    if (fdir.length() < 0.2) fdir = new THREE.Vector3().crossVectors(lat, sd); fdir.normalize();
    if (o.footPoint === 'down' || (Fo.y > 0.05 && o.pointToes)) fdir.lerp(sd, 0.6).normalize();
    const footM = mesh(new THREE.SphereGeometry(1, 24, 16), MAT); footM.scale.set(0.04, 0.13, 0.035);
    footM.position.copy(Fo).addScaledVector(fdir, 0.075).addScaledVector(sd, 0.02); footM.quaternion.setFromUnitVectors(UP, fdir);

  const pr = o.prop;
  if (pr === 'wall' || pr === 'wallR') { const x = pr === 'wall' ? (103 - 150) / 100 - 0.12 : (197 - 150) / 100 + 0.12; const w = mesh(new THREE.BoxGeometry(0.1, 3, 3), WALLM); w.position.set(x, 1.5, 0); }
  if (pr === 'bar' || pr === 'barfront') {
    const b = mesh(new THREE.CylinderGeometry(0.018, 0.018, pr === 'bar' ? 1.4 : 1.2, 20), PROPM);
    const yb = (190 - 14) / 100;
    if (pr === 'bar') { b.rotation.x = Math.PI / 2; b.position.set(((pose.hN[0] + pose.hF[0]) / 2 - 150) / 100, yb, 0); }
    else { b.rotation.z = Math.PI / 2; b.position.set(0, yb, 0); }
    for (const s of [-1, 1]) { const post = mesh(new THREE.CylinderGeometry(0.03, 0.03, yb, 16), PROPM); if (pr === 'bar') post.position.set(b.position.x, yb / 2, s * 0.7); else post.position.set(s * 0.6, yb / 2, -0.15); }
  }

// ---------- pose interpolation (bone angles + lengths) ----------
const BONES = [['nk', 'hp'], ['hd', 'nk'], ['eN', 'nk'], ['hN', 'eN'], ['eF', 'nk'], ['hF', 'eF'], ['kN', 'hp'], ['fN', 'kN'], ['kF', 'hp'], ['fF', 'kF']];
